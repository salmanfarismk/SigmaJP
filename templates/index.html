<!DOCTYPE html>
<html>

<head>
    <title>SigmaJP - Japanese Flashcards</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>日本語 Flashcards</h1>
        <p class="subtitle"><span class="deck-stat">📚 {{ card_count }} cards in deck</span></p>

        <div class="menu">
            <a href="/quiz" class="btn primary">Start Quiz 🎯</a>
            <a href="/cards" class="btn secondary">View Deck 📖</a>
        </div>

        <div class="add-form">
            <h2>➕ Add a New Card</h2>
            <form action="/add" method="POST">
                <input type="text" name="japanese" placeholder="Japanese Word (e.g. 桜 or さくら)" required
                    autocomplete="off">
                <input type="text" name="reading" placeholder="Reading / Furigana (e.g. sakura)" required
                    autocomplete="off">
                <input type="text" name="meaning" placeholder="Meaning in English (e.g. cherry blossom)" required
                    autocomplete="off">
                <button type="submit" class="btn primary">Add to Deck</button>
            </form>
        </div>
    </div>
</body>

</html>
